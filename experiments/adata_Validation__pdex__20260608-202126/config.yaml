# Frozen configuration for this robustness experiment (metaskill: evaluating-metrics-robustness).
# Reproduce: from this folder, `source ../../.venv/bin/activate && python run.py --config config.yaml`
adata_path: /home/yangzhang/code/cell-eval/adata_Validation.h5ad
de_method: pdex              # cell-level Wilcoxon rank-sum (cell-eval run --de-methods pdex)
pert_col: target_gene
control_pert: non-targeting
replicate_col: batch         # optional for pdex; recorded for provenance
sgrna_col: guide_id
target_gene_col: target_gene # matches var_names for all 50 perturbations
block_cols: [batch]          # stratify splits / permutations within batch
allow_discrete: false        # pdex is_log1p=True -> data is treated as log-normalized
normalize_if_raw: true       # .X is raw integer counts -> normalize_total + log1p up front
counts_layer: null           # use .X
fdr_threshold: 0.05
lfc_threshold: 0.1
n_permutations: 10           # TEST_PLAN.md default (full run)
min_cells_per_group: 20
seed: 0
max_conditions: null         # null = all 50 perturbations
num_threads: 16
outdir: .                    # outputs land in this experiment folder (portable)
tests: [test_1, test_2, test_3, test_4, test_5, test_6]
