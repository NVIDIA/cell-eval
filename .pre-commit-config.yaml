repos:
  - repo: local
    hooks:
      - id: ruff-format-check
        name: ruff format check
        entry: uv run ruff format --check
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: ty-check
        name: ty check
        entry: uv run ty check
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: pytest
        name: pytest (optional; set RUN_PYTEST_PRE_PUSH=1)
        entry: bash -c 'if [ "${RUN_PYTEST_PRE_PUSH:-0}" = "1" ]; then uv run pytest -q; else echo "Skipping pytest; set RUN_PYTEST_PRE_PUSH=1 to run."; fi'
        language: system
        pass_filenames: false
        stages: [pre-push]
