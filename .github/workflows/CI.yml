name: "CI"

on:
  push:
    branches:
      - main
      - dev
      - "pull-request/[0-9]+"

jobs:
  pr-info:
    if: startsWith(github.ref_name, 'pull-request/')
    runs-on: linux-amd64-cpu8
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr-info: ${{ steps.get-pr-info.outputs.pr-info }}
    steps:
      - name: Get PR info
        id: get-pr-info
        uses: nv-gha-runners/get-pr-info@main

      - name: Show PR context
        run: |
          echo "PR number: ${{ fromJSON(steps.get-pr-info.outputs.pr-info).number }}"
          echo "Base ref: ${{ fromJSON(steps.get-pr-info.outputs.pr-info).base.ref }}"
          echo "Head ref: ${{ fromJSON(steps.get-pr-info.outputs.pr-info).head.ref }}"

  all_jobs:
    runs-on: linux-amd64-cpu8
    needs: [formatting, typing, pytest, cli-test]
    steps:
      - name: Complete
        run: echo "Complete"

  install-job:
    runs-on: linux-amd64-cpu8

    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          python-version: "3.12"

      - name: install dependencies
        run: |
          uv sync --all-extras --dev

  formatting:
    runs-on: linux-amd64-cpu8

    needs: [install-job]

    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          python-version: "3.12"

      - name: install dependencies
        run: |
          uv sync --all-extras --dev

      - name: run formatting
        run: |
          uv run ruff format --check

  typing:
    runs-on: linux-amd64-cpu8

    needs: [install-job]

    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          python-version: "3.12"

      - name: install dependencies
        run: |
          uv sync --all-extras --dev

      - name: run type checking
        run: |
          uv run ty check

  pytest:
    runs-on: linux-amd64-cpu8

    needs: [install-job]

    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          python-version: "${{ matrix.python-version }}"

      - name: install dependencies
        run: |
          uv sync --all-extras --dev

      - name: run pytest
        run: |
          uv run pytest -v

  cli-test:
    runs-on: linux-amd64-cpu8

    needs: [install-job]

    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          python-version: "3.12"

      - name: install dependencies
        run: |
          uv sync --all-extras --dev

      - name: run cli tests
        run: |
          uv run cell-eval --help
