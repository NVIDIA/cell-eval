# RobustnessConfig for the cell-eval PyDESeq2-backend robustness battery.
# Run: uv run python .claude/skills/evaluating-pydeseq2-robustness/scripts/run_robustness.py --config this.yaml
# (JSON is also accepted; inspect_dataset.py emits a JSON skeleton you can paste here.)

# --- required -------------------------------------------------------------- #
adata_path: /path/to/perturbation.h5ad
pert_col: target_gene          # obs column with the perturbation label per cell
control_pert: non-targeting    # value in pert_col marking control cells
replicate_col: gem_group       # obs column = independent sample unit for PyDESeq2 pseudobulk
                               # (donor / lane / gem_group / biological replicate). REQUIRED by the backend.

# --- counts source --------------------------------------------------------- #
# PyDESeq2 needs RAW INTEGER counts. Either point at a raw-counts layer (preferred,
# leaves .X free as lognorm for AnnData-level metrics) or set counts_layer: null to
# use .X directly (then .X must be raw integers and allow_discrete must be true).
counts_layer: counts
allow_discrete: true           # true => do NOT auto-normalize .X (keep raw counts intact)

# --- optional annotations (gate which tests can run) ----------------------- #
target_gene_col: target_gene   # sgRNA/perturbation -> target gene symbol (tests 5, 6, 7); must match var_names
sgrna_col: sgrna               # per-guide identity (tests 4, 5); controls carry control_pert here too
block_cols: [donor, cell_type] # covariates to stratify splits / permutations within (tests 1-4)

# --- knobs ----------------------------------------------------------------- #
fdr_threshold: 0.05
seed: 0
num_threads: 8
max_conditions: null           # cap perts/conditions iterated per test (cost control); null = all
outdir: ./pdrobust-out

# stress tests 9/10
downsample_grid: [25, 50, 100, 200, 500, 1000]          # perturbed-cell grid (test 9)
control_downsample_grid: [500, 1000, 2000, 5000]        # control-cell grid (test 10); needs to be
                                                        # finer/larger — small control pseudobulks
                                                        # destabilize LFCs. null => use downsample_grid
n_repeats: 3
stable_lfc_corr: 0.9        # corr-to-full at/above which a downsample level counts as "stable"
min_pseudobulk_cells: 10    # warn when a pseudobulk sample is built from fewer cells than this

# PyDESeq2 backend options (forwarded as de_kwargs["pydeseq2"]).
# Keys: min_total_count, fill_filtered, dds_kwargs, stats_kwargs.
pydeseq2_kwargs:
  min_total_count: 10

# which tests: list of test_1..test_10, or ["all"]
tests: ["all"]

# --- optional curated resources (tests 7 & 8) ------------------------------ #
# curated_targets_csv: /path/to/curated.csv      # see curated_targets_schema.md
# gene_sets_json: /path/to/gene_sets.json         # {"<pert_gene>": ["geneA", "geneB", ...]}
