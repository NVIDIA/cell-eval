# control_null_diagnostics.py — run both pdex and pydeseq2 in one pass
# python control_null_diagnostics.py --adata <h5ad> --methods pdex,pydeseq2 #   --pert-col gene --control non-targeting --replicate-col batch --block-cols batch #   --n-resamples 10 --outdir .
adata: /path/to/k562_essential_sub.h5ad
methods: pdex,pydeseq2
pert_col: gene
control: non-targeting
replicate_col: batch
block_cols: batch
fdr: 0.05
lfc: 0.1
n_resamples: 10
seed: 0
